name: 功能建议
description: 想支持新的包管理器、通知渠道，或改进使用体验
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便？什么场景下会用到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果是新的检测来源，请写明怎么列出已装的工具、怎么查最新版本（相关命令或 API）
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充
